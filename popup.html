<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 320px; padding: 15px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f9f9f9; }
    h3 { margin-top: 0; font-size: 14px; color: #333; }
    textarea { width: 100%; height: 80px; padding: 8px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; resize: none; font-size: 13px; }
    button { width: 100%; padding: 10px; margin-top: 10px; background: #d97757; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
    button:hover { background: #bf5b3f; }
    .note { font-size: 11px; color: #888; margin-top: 10px; line-height: 1.4; }
  </style>
</head>
<body>
  <h3>Design Instruction</h3>
  <textarea id="promptInput" placeholder="e.g. Make this button have a 2px blue border and rounded corners..."></textarea>
  <button id="startBtn">Select Element & Send</button>
  <p class="note"><b>How it works:</b> After clicking, hover and click the element in the preview. Claude will receive the instruction, and this page will refresh in 5 seconds.</p>
  <script src="popup.js"></script>
</body>
</html>
